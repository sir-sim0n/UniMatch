name: Student community database checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: orbit_ci_only
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: orbit_ci_only
      PGDATABASE: orbit_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Create isolated Auth fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres-auth-fixture.sql
      - name: Check fresh schema and migrations
        shell: bash
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Check student privacy and permissions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/student-communities.sql
