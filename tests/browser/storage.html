<!doctype html><html><meta charset="utf-8"><title>Orbit storage regression tests</title><h1>Isolated storage tests</h1><p id="result">Running</p><script type="module">
import {openSocial} from './assets/indexed-social.mjs';import {emptySocial,SOCIAL_KEY} from './assets/demo-social.mjs?v=1.12.0';
const out=document.querySelector('#result');let first,second;const name='orbit-test-'+Date.now();const data=emptySocial(),raw=JSON.stringify(data),legacy={getItem:k=>k===SOCIAL_KEY?raw:null};const check=(value,msg)=>{if(!value)throw Error(msg)};
try{first=await openSocial({name,legacy:()=>legacy});check(first.data.feedPosts.length===3,'migration records');check(legacy.getItem(SOCIAL_KEY)===raw,'legacy retained');const messages=first.data.messages;await first.change('naledi','feed-save',1);check(first.data.messages===messages,'unrelated collections not cloned');const commit=first.persistence.commit;first.persistence.commit=async()=>{throw Error('simulated storage failure')};const beforeFailure=JSON.stringify(first.data);try{await first.change('naledi','feed-save',3)}catch{}check(JSON.stringify(first.data)===beforeFailure,'failed commit rolled back');first.persistence.commit=commit;second=await openSocial({name,legacy:()=>legacy});check(second.data.postSaves.length===1,'persisted bookmark');await first.change('naledi','feed-save',2);let rejected=false;try{await second.change('naledi','feed-save',3)}catch{rejected=true}check(rejected,'stale write rejected');await second.reload();check(second.data.postSaves.length===2,'reload revision');const snapshot=JSON.stringify(second.data);try{await second.importBackup(JSON.stringify({format:'orbit-social-backup',version:1,data:{bad:true}}));throw Error('accepted bad backup')}catch{}check(JSON.stringify(second.data)===snapshot,'bad backup rollback');await second.resetAll(true);check(second.data.postSaves.length===0,'atomic reset');await second.importBackup(JSON.stringify({format:'orbit-social-backup',version:1,data:JSON.parse(snapshot)}));check(second.data.postSaves.length===2,'backup restore');first.close();second.close();second=await openSocial({name,legacy:()=>legacy});check(second.data.postSaves.length===2,'restore survives reload');out.textContent='PASS: migration, legacy preservation, persistence, atomic reset, stale writes, reload, invalid backup rollback and restore.';}catch(e){out.textContent='FAIL: '+e.stack}finally{first?.close();second?.close();indexedDB.deleteDatabase(name)}
