async function api(path,body){const u=new URL(path,'https://qa.invalid');if(u.pathname==='/events')return {items:post.event_at?[structuredClone(post)]:[]};if(u.pathname==='/posts'&&body){Object.assign(post,{title:body.title,text:body.text,flair:body.flair,event_at:body.eventAt,event_place:body.eventPlace});return {id:post.id};}if(u.pathname==='/feed')return {items:[structuredClone(post)]};if(path.startsWith('/posts/101/comments')){if(body){replies.push({id:14,post:101,parent:body.parent??null,author:'naledi',text:body.text,upvotes:0,deleted:false});post.reply_count++;}return {items:structuredClone(replies).reverse()};}if(path==='/posts/101/best'){post.best_answer=body.reply;return {ok:true};}if(path==='/posts/101/save'){post.saved=!post.saved;return {ok:true};}if(path==='/posts/101/vote'){post.voted=!post.voted;return {ok:true};}if(path==='/posts/101')return structuredClone(post);if(u.pathname==='/circles')return {items:[structuredClone(circle)]};if(path==='/circles/1/members')return {members:[{user:'naledi',role:'owner'},{user:'sipho',role:'member'}],requests:[]};if(u.pathname==='/profiles')return {items:[]};if(path==='/circles/1/settings'){Object.assign(circle,body);return {ok:true};}if(path==='/circles/1/pin'){circle.pinned_post=body.post;return {ok:true};}if(path.startsWith('/comments/'))return {ok:true};throw Error('Fixture route missing: '+path);}
